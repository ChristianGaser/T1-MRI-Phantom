[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t1sim"
dynamic = ["version"]
description = "Simulated T1-weighted MR images with a known ground truth"
authors = [
    { name = "Christian Gaser" },
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "requests",
]

[project.optional-dependencies]
# What turns a real scan into a ground truth and changes its anatomy: the
# unified segmentation, LAS, SANLM, the atlases and the vessel detection.
# T1Prep 0.9.3 is the first version with unified_seg.segment(deformation=True);
# torch, which T1Prep needs as well, runs the movement artefacts and the
# deformations.
frontend = [
    "cat-surf>=1.2.0",
    "T1Prep>=0.9.3",
    "torch",
]

[project.scripts]
t1sim = "t1sim.simulate:main"
t1sim-download-models = "t1sim.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "t1sim.__version__"}
